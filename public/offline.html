<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sem conexão · Gêmeos Academia</title>
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .badge { width: 88px; height: 88px; border-radius: 50%; border: 2px solid #dc2626; display: flex; align-items: center; justify-content: center; font-size: 44px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.375rem; margin: 0 0 .5rem; letter-spacing: -0.01em; }
    p { color: #a1a1a1; max-width: 28ch; margin: 0 0 2rem; line-height: 1.5; font-size: .95rem; }
    button { background: #dc2626; color: #fff; border: 0; padding: .85rem 1.5rem; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(0.98); }
    footer { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 1rem); color: #6b6b6b; font-size: .75rem; }
    footer a { color: #a1a1a1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">🥋</div>
    <h1>Sem conexão</h1>
    <p>Você está offline. Reconecte para atualizar seus dados.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
  <footer>Desenvolvido por <a href="https://MtsFerreira.dev" target="_blank" rel="noopener noreferrer">MtsFerreira</a></footer>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
